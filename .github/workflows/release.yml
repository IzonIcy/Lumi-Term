name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # eframe's Linux link step needs the X11/Mesa dev headers; without
      # them every Linux release tag fails while CI (which installs these)
      # stays green.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libegl1-mesa-dev
      - run: cargo build --release --locked
      - name: Package
        run: |
          dir="lumi-term-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir "$dir"
          cp target/release/lumi-term "$dir/"
          cp README.md LICENSE "$dir/"
          tar czf "$dir.tar.gz" "$dir"
      - uses: softprops/action-gh-release@v3
        with:
          files: "*.tar.gz"
          generate_release_notes: true
